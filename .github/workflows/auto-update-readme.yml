name: Auto Update README

on:
  workflow_dispatch:
  schedule:
    - cron: '11 7 * * *'
    - cron: '57 6 * * *'   # 13:57 WIB (6:57 UTC)
    - cron: '0 9 * * *'    # 16:00 WIB (9:00 UTC)
    - cron: '5 9 * * *'    # 16:05 WIB (9:05 UTC)
    - cron: '10 9 * * *'   # 16:10 WIB (9:10 UTC)

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update README File
        run: |
          TIME=$(date '+%Y-%m-%d %H:%M:%S')
          CONTENT="> 🕒 **Last Update:** $TIME WIB"
          perl -i -pe "BEGIN{undef $/;} s/.*?/\n$CONTENT\n/s" README.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Auto update README $TIME" || echo "No changes to commit"
          git push
