name: Daily README Update

on:
  schedule:
    # Jalan setiap hari jam 02:00 UTC (09:00 WIB)
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README timestamp
        run: |
          sed -i '/<!-- last-auto-update:/d' README.md
          echo "<!-- last-auto-update: $(date -u +'%Y-%m-%d %H:%M:%S UTC') -->" >> README.md

      - name: Commit and push changes
        run: |
          git config --local user.email "mochsyarifhidayat24@gmail.com"
          git config --local user.name "Moch Syarif Hidayat"
          git add README.md
          git commit -m "chore: daily update" || exit 0
          git push
